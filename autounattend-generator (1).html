<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سازنده‌ی autounattend.xml — نصب خودکار ویندوز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1118;
  --bg-2:#111827;
  --panel:#161f2c;
  --panel-2:#1b2534;
  --line:#26334a;
  --line-soft:#1e293b;
  --text:#e7ecf2;
  --muted:#8a96a8;
  --muted-2:#5d6a7f;
  --accent:#4fd8c4;
  --accent-2:#3ab8a6;
  --amber:#f5a94e;
  --red:#e6685f;
  --disk-empty:#1b2432;
  --font-ui:'Vazirmatn',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html[data-applang="en"]{ --font-ui:'Inter',sans-serif; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(79,216,196,0.07), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(245,169,78,0.05), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  min-height:100vh;
  line-height:1.7;
}
.mono{font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate;}
::selection{background:var(--accent);color:#06110f;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

.topbar{
  padding:22px 28px 14px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line-soft);
  flex-wrap:wrap;gap:12px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-weight:800;color:#06120f;font-size:13px;letter-spacing:-.5px;
  box-shadow:0 0 0 1px rgba(79,216,196,.3),0 10px 26px -10px rgba(79,216,196,.7);
  flex-shrink:0;transition:transform .2s ease;
}
.brand-mark:hover{transform:rotate(-6deg) scale(1.05);}
.brand-text h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;}
.brand-text p{margin:2px 0 0;font-size:12.5px;color:var(--muted);font-family:var(--font-mono);direction:ltr;text-align:left;}
.top-right{display:flex;align-items:center;gap:10px;}
.source-link{
  font-size:12px;color:var(--muted);font-family:var(--font-mono);direction:ltr;
  border:1px solid var(--line);padding:6px 12px;border-radius:100px;text-decoration:none;
  transition:.2s;white-space:nowrap;
}
.source-link:hover{border-color:var(--accent);color:var(--accent);}
.lang-toggle{
  display:flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;font-family:var(--font-mono);font-size:12px;
}
.lang-toggle button{
  border:none;background:transparent;color:var(--muted);padding:7px 14px;cursor:pointer;font-family:var(--font-mono);
  transition:.15s;
}
.lang-toggle button.active{background:var(--accent);color:#06120f;font-weight:700;}

.diskbar-wrap{padding:18px 28px 8px;}
.diskbar-label{
  display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted-2);
  font-family:var(--font-mono);direction:ltr;margin-bottom:7px;letter-spacing:.5px;text-transform:uppercase;
}
.diskbar{
  display:flex;gap:3px;height:32px;border-radius:8px;overflow:hidden;
  border:1px solid var(--line);padding:3px;background:var(--bg-2);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.4);
}
.diskbar .part{
  flex:1;border-radius:4px;background:var(--disk-empty);position:relative;
  transition:background .5s ease, box-shadow .5s ease;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:10px;color:var(--muted-2);overflow:hidden;
}
.diskbar .part.done{background:linear-gradient(90deg,var(--accent-2),var(--accent));color:#06120f;font-weight:600;}
.diskbar .part.current{background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 2px var(--accent);}
.diskbar .part.current::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(79,216,196,.25) 50%,transparent 70%);
  animation:scan 1.6s linear infinite;
}
@keyframes scan{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}

.layout{display:flex;gap:0;max-width:1180px;margin:0 auto;padding:22px 28px 60px;align-items:flex-start;gap:26px;}
.sidebar{
  width:230px;flex-shrink:0;position:sticky;top:20px;
  display:flex;flex-direction:column;gap:2px;
}
.step-nav{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:10px;cursor:pointer;
  color:var(--muted);font-size:13.5px;transition:transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
  border:1px solid transparent;
}
.step-nav:hover{background:var(--panel);color:var(--text);transform:translateX(-2px);}
html[dir=ltr] .step-nav:hover{transform:translateX(2px);}
.step-nav.active{background:var(--panel);color:var(--accent);border-color:rgba(79,216,196,.35);box-shadow:0 6px 18px -12px rgba(79,216,196,.5);}
.step-nav .num{
  font-family:var(--font-mono);font-size:11px;width:24px;height:24px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;background:var(--panel-2);color:var(--muted-2);flex-shrink:0;
  transition:.2s;
}
.step-nav.active .num{background:var(--accent);color:#06120f;box-shadow:0 0 0 3px rgba(79,216,196,.18);}
.step-nav.visited .num{background:var(--accent-2);color:#06120f;}

.content{flex:1;min-width:0;}
.card{
  background:linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 14%);
  border:1px solid var(--line-soft);border-radius:16px;
  padding:30px 32px;animation:fadein .4s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 30px 60px -30px rgba(0,0,0,.55);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--amber),transparent);
  opacity:.55;
}
@keyframes fadein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.card h2{
  margin:0 0 6px;font-size:20.5px;font-weight:800;letter-spacing:.1px;
  background:linear-gradient(90deg,var(--text),var(--accent) 130%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.card .sub{color:var(--muted);font-size:13.5px;margin:0 0 26px;max-width:640px;}

.field{margin-bottom:20px;}
.field label.title{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px;color:var(--text);}
.field .hint{font-size:12px;color:var(--muted-2);margin-top:6px;}
select,input[type=text],input[type=password],input[type=number],textarea{
  width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--text);
  padding:10px 12px;border-radius:8px;font-family:var(--font-ui);font-size:13.5px;outline:none;transition:.15s;
}
input[dir=ltr],.ltr-input{direction:ltr;text-align:left;font-family:var(--font-mono);}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,216,196,.12);}
textarea{resize:vertical;min-height:90px;font-family:var(--font-mono);direction:ltr;text-align:left;}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
@media(max-width:640px){.row2,.row3{grid-template-columns:1fr;}}

.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.choice{
  border:1px solid var(--line);background:var(--bg-2);border-radius:11px;padding:14px 15px;cursor:pointer;
  transition:transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;position:relative;
}
.choice:hover{border-color:var(--muted-2);transform:translateY(-2px);}
.choice.selected{
  border-color:var(--accent);background:rgba(79,216,196,.09);
  box-shadow:0 8px 22px -12px rgba(79,216,196,.55), inset 0 0 0 1px rgba(79,216,196,.25);
}
.choice .t{font-size:13.5px;font-weight:600;}
.choice .d{font-size:11.5px;color:var(--muted);margin-top:3px;}
.choice.selected::before{
  content:'✓';position:absolute;top:-7px;inset-inline-start:-7px;color:#06120f;font-size:11px;font-weight:800;
  width:18px;height:18px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.35);
}

.toggle-row{
  display:flex;align-items:flex-start;gap:12px;padding:13px 10px;border-bottom:1px solid var(--line-soft);
  border-radius:8px;transition:background .15s ease;margin:0 -10px;
}
.toggle-row:hover{background:rgba(255,255,255,.02);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .txt{flex:1;}
.toggle-row .t{font-size:13.5px;font-weight:600;}
.toggle-row .d{font-size:12px;color:var(--muted);margin-top:3px;}
.switch{
  width:42px;height:24px;border-radius:100px;background:var(--bg-2);border:1px solid var(--line);
  position:relative;cursor:pointer;flex-shrink:0;transition:.2s;margin-top:2px;
}
.switch.on{background:var(--accent-2);border-color:var(--accent-2);}
.switch .knob{
  width:18px;height:18px;border-radius:50%;background:#dfe6ee;position:absolute;top:2px;inset-inline-end:2px;
  transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.4);
}
.switch.on .knob{inset-inline-end:20px;background:#06120f;}

.checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;}
.chk{
  display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg-2);cursor:pointer;font-size:12.8px;transition:transform .15s ease, border-color .15s ease, background .15s ease;
}
.chk:hover{border-color:var(--muted-2);transform:translateY(-1px);}
.chk.on{border-color:var(--amber);background:rgba(245,169,78,.1);color:var(--amber);box-shadow:0 6px 16px -12px rgba(245,169,78,.6);}
.chk .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--muted-2);flex-shrink:0;position:relative;}
.chk.on .box{background:var(--amber);border-color:var(--amber);}
.chk.on .box::before{content:'✕';position:absolute;top:-3px;left:2px;font-size:10px;color:#06120f;}

.accounts{display:flex;flex-direction:column;gap:12px;}
.account-card{border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:15px 17px;transition:border-color .15s ease;}
.account-card:hover{border-color:var(--muted-2);}
.account-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.account-head .tag{font-family:var(--font-mono);font-size:11px;color:var(--muted-2);}
.rm-btn{background:none;border:1px solid var(--line);color:var(--red);border-radius:7px;padding:5px 10px;font-size:11.5px;cursor:pointer;font-family:var(--font-ui);}
.rm-btn:hover{border-color:var(--red);}
.add-btn{
  border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:10px;
  padding:12px;text-align:center;cursor:pointer;font-size:13px;font-family:var(--font-ui);transition:.15s;
}
.add-btn:hover{border-color:var(--accent);color:var(--accent);}

.nav-buttons{display:flex;justify-content:space-between;margin-top:26px;}
.btn{
  padding:11px 22px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);
  font-family:var(--font-ui);font-size:13.5px;cursor:pointer;transition:transform .15s ease, border-color .15s ease, filter .15s ease, box-shadow .15s ease;
  display:flex;align-items:center;gap:8px;
}
.btn:hover{border-color:var(--muted-2);transform:translateY(-1px);}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#06120f;font-weight:700;
  box-shadow:0 10px 26px -12px rgba(79,216,196,.6);
}
.btn.primary:hover{filter:brightness(1.08);transform:translateY(-2px);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}

.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
@media(max-width:640px){.summary-grid{grid-template-columns:1fr;}}
.summary-item{background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:11px 14px;font-size:12.5px;}
.summary-item b{display:block;color:var(--muted-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-family:var(--font-mono);}
.xml-box{
  background:#080c12;border:1px solid var(--line);border-radius:10px;padding:16px;max-height:340px;overflow:auto;
  font-size:11.5px;line-height:1.6;white-space:pre;
}

.final-panel{text-align:center;padding:30px 10px 10px;}
.check-circle{
  width:74px;height:74px;border-radius:50%;background:rgba(79,216,196,.1);border:2px solid var(--accent);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;position:relative;
}
.check-circle svg{width:34px;height:34px;}
.check-circle path{
  stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s ease forwards .15s;
}
@keyframes draw{to{stroke-dashoffset:0;}}
.pulse-ring{position:absolute;inset:-8px;border-radius:50%;border:1px solid var(--accent);opacity:0;animation:pulse 1.8s ease-out infinite;}
@keyframes pulse{0%{opacity:.6;transform:scale(.9);}100%{opacity:0;transform:scale(1.35);}}

.download-btn{
  display:inline-flex;align-items:center;gap:10px;padding:15px 32px;border-radius:11px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06120f;font-weight:700;font-size:15px;
  cursor:pointer;font-family:var(--font-ui);box-shadow:0 12px 30px -12px rgba(79,216,196,.55);transition:.2s;
}
.download-btn:hover{transform:translateY(-2px);filter:brightness(1.05);}
.usage-note{
  background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:24px;
  font-size:13px;color:var(--muted);
}
.usage-note b{color:var(--text);}
.usage-note ol{margin:8px 0 0;padding-inline-start:20px;}
.usage-note li{margin-bottom:5px;}

footer{text-align:center;color:var(--muted-2);font-size:11.5px;padding:20px;font-family:var(--font-mono);}
@media(max-width:900px){
  .layout{flex-direction:column;}
  .sidebar{position:static;width:100%;flex-direction:row;flex-wrap:wrap;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">XML</div>
    <div class="brand-text">
      <h1 id="appTitle">سازنده‌ی autounattend.xml</h1>
      <p id="appSubtitle">unattended Windows 10 / 11 setup builder</p>
    </div>
  </div>
  <div class="top-right">
    <div class="lang-toggle">
      <button id="langFaBtn" class="active">FA</button>
      <button id="langEnBtn">EN</button>

    <a class="source-link" id="sourceLink" href="https://schneegans.de/windows/unattend-generator/" target="_blank">schneegans.de/windows/unattend-generator ↗</a>

</div>

<div class="diskbar-wrap">
  <div class="diskbar-label"><span id="diskbar-caption">STEP 1 / 11</span><span id="diskbar-pct">0%</span></div>

</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content">
    <div class="card" id="card"></div>
  </div>
</div>

<footer id="footerNote">generated locally in your browser · no data leaves your machine</footer>

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML='';
  const titles = t('steps');
  titles.forEach((title,i)=>{
    const div = el(`<div class="step-nav ${i===current?'active':i<current?'visited':''}">
      <div class="num">${i<current?'✓':STEP_ICONS[i]}</div><div>${title}</div></div>`);
    div.onclick=()=>{ current=i; renderAll(); };

  const bar = document.getElementById('diskbar');
  bar.innerHTML='';
  titles.forEach((title,i)=>{

  });

function navButtons(container){
  const wrap = el(`<div class="nav-buttons">
    <button class="btn" id="prevBtn">${t('prev')}</button>
    <button class="btn primary" id="nextBtn">${current===stepRenderers.length-1?t('finish'):t('next')}</button>

}

/* ================= XML GENERATION ================= */
function xmlEscape(s){return esc(s);}

function toUtf16LEBase64(str){
  const bytes = new Uint8Array(str.length*2);
  for(let i=0;i<str.length;i++){
    const code = str.charCodeAt(i);
    bytes[i*2] = code & 0xff;
    bytes[i*2+1] = (code>>8) & 0xff;
  }
  let binary='';
  for(let i=0;i<bytes.length;i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

function generateXML(){
  const L = [];
  const push = s=>L.push(s);
  const isGPT = state.diskLayout==='gpt';
  const hasRec = state.recoveryPartition;

  push(`<?xml version="1.0" encoding="utf-8"?>`);
  push(`<unattend xmlns="urn:schemas-microsoft-com:unattend">`);

  push(`  <settings pass="windowsPE">`);
  push(`    <component name="Microsoft-Windows-International-Core-WinPE" processorArchitecture="${state.arch}" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">`);
  push(`      <SetupUILanguage><UILanguage>${state.uiLang}</UILanguage></SetupUILanguage>`);
  push(`      <InputLocale>${state.keyboard}</InputLocale>`);
  push(`      <SystemLocale>${state.uiLang}</SystemLocale>`);
  push(`      <UILanguage>${state.uiLang}</UILanguage>`);
  push(`      <UserLocale>${state.uiLang}</UserLocale>`);
  push(`    </component>`);

  push(`    <component name="Microsoft-Windows-Setup" processorArchitecture="${state.arch}" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">`);

  let rsOrder=1;
  if(state.bypassWin11 || state.bypassNRO){
    push(`      <RunSynchronous>`);
    if(state.bypassWin11){
      push(`        <RunSynchronousCommand wcm:action="add"><Order>${rsOrder++}</Order><Path>reg.exe add HKLM\\SYSTEM\\Setup\\LabConfig /v BypassTPMCheck /t REG_DWORD /d 1 /f</Path></RunSynchronousCommand>`);
      push(`        <RunSynchronousCommand wcm:action="add"><Order>${rsOrder++}</Order><Path>reg.exe add HKLM\\SYSTEM\\Setup\\LabConfig /v BypassSecureBootCheck /t REG_DWORD /d 1 /f</Path></RunSynchronousCommand>`);
      push(`        <RunSynchronousCommand wcm:action="add"><Order>${rsOrder++}</Order><Path>reg.exe add HKLM\\SYSTEM\\Setup\\LabConfig /v BypassRAMCheck /t REG_DWORD /d 1 /f</Path></RunSynchronousCommand>`);
      push(`        <RunSynchronousCommand wcm:action="add"><Order>${rsOrder++}</Order><Path>reg.exe add HKLM\\SYSTEM\\Setup\\LabConfig /v BypassStorageCheck /t REG_DWORD /d 1 /f</Path></RunSynchronousCommand>`);
      push(`        <RunSynchronousCommand wcm:action="add"><Order>${rsOrder++}</Order><Path>reg.exe add HKLM\\SYSTEM\\Setup\\LabConfig /v BypassCPUCheck /t REG_DWORD /d 1 /f</Path></RunSynchronousCommand>`);
    }
    if(state.bypassNRO){
      push(`        <RunSynchronousCommand wcm:action="add"><Order>${rsOrder++}</Order><Path>reg.exe add HKLM\\SYSTEM\\Setup\\LabConfig /v BypassNRO /t REG_DWORD /d 1 /f</Path></RunSynchronousCommand>`);
    }
    push(`      </RunSynchronous>`);
  }

  push(`      <DiskConfiguration>`);
  push(`        <Disk wcm:action="add">`);
  push(`          <DiskID>0</DiskID>`);
  push(`          <WillWipeDisk>true</WillWipeDisk>`);
  push(`          <CreatePartitions>`);
  let order=1, sysPartId, winPartId, recPartId;
  if(isGPT){
    push(`            <CreatePartition wcm:action="add"><Order>${order}</Order><Type>EFI</Type><Size>300</Size></CreatePartition>`); sysPartId=order; order++;
    push(`            <CreatePartition wcm:action="add"><Order>${order}</Order><Type>MSR</Type><Size>16</Size></CreatePartition>`); order++;
    if(hasRec){
      push(`            <CreatePartition wcm:action="add"><Order>${order}</Order><Type>Primary</Type><Size>990</Size></CreatePartition>`); recPartId=order; order++;
    }
    push(`            <CreatePartition wcm:action="add"><Order>${order}</Order><Type>Primary</Type><Extend>true</Extend></CreatePartition>`); winPartId=order; order++;
  } else {
    push(`            <CreatePartition wcm:action="add"><Order>${order}</Order><Type>Primary</Type><Size>100</Size></CreatePartition>`); sysPartId=order; order++;
    if(hasRec){
      push(`            <CreatePartition wcm:action="add"><Order>${order}</Order><Type>Primary</Type><Size>990</Size></CreatePartition>`); recPartId=order; order++;
    }
    push(`            <CreatePartition wcm:action="add"><Order>${order}</Order><Type>Primary</Type><Extend>true</Extend></CreatePartition>`); winPartId=order; order++;
  }
  push(`          </CreatePartitions>`);
  push(`          <ModifyPartitions>`);
  let mOrder=1;
  if(isGPT){
    push(`            <ModifyPartition wcm:action="add"><Order>${mOrder++}</Order><PartitionID>${sysPartId}</PartitionID><Label>System</Label><Format>FAT32</Format></ModifyPartition>`);
    if(hasRec){
      push(`            <ModifyPartition wcm:action="add"><Order>${mOrder++}</Order><PartitionID>${recPartId}</PartitionID><Label>Recovery</Label><Format>NTFS</Format><TypeID>DE94BBA4-06D1-4D40-A16A-BFD50179D6AC</TypeID></ModifyPartition>`);
    }
    push(`            <ModifyPartition wcm:action="add"><Order>${mOrder++}</Order><PartitionID>${winPartId}</PartitionID><Label>Windows</Label><Format>NTFS</Format><Letter>C</Letter></ModifyPartition>`);
  } else {
    push(`            <ModifyPartition wcm:action="add"><Order>${mOrder++}</Order><PartitionID>${sysPartId}</PartitionID><Label>System</Label><Format>NTFS</Format><Active>true</Active><Letter>S</Letter></ModifyPartition>`);
    if(hasRec){
      push(`            <ModifyPartition wcm:action="add"><Order>${mOrder++}</Order><PartitionID>${recPartId}</PartitionID><Label>Recovery</Label><Format>NTFS</Format><TypeID>27</TypeID></ModifyPartition>`);
    }
    push(`            <ModifyPartition wcm:action="add"><Order>${mOrder++}</Order><PartitionID>${winPartId}</PartitionID><Label>Windows</Label><Format>NTFS</Format><Letter>C</Letter></ModifyPartition>`);
  }
  push(`          </ModifyPartitions>`);
  push(`        </Disk>`);
  push(`      </DiskConfiguration>`);

  push(`      <ImageInstall>`);
  push(`        <OSImage>`);
  push(`          <InstallTo><DiskID>0</DiskID><PartitionID>${winPartId}</PartitionID></InstallTo>`);
  push(`          <InstallToAvailablePartition>false</InstallToAvailablePartition>`);
  push(`        </OSImage>`);
  push(`      </ImageInstall>`);

  push(`      <UserData>`);
  push(`        <AcceptEula>true</AcceptEula>`);
  if(state.keyMode==='generic'){
    const key = EDITIONS.find(e=>e[0]===state.edition)[1];
    push(`        <ProductKey><Key>${key}</Key></ProductKey>`);
  } else if(state.keyMode==='custom' && state.customKey){
    push(`        <ProductKey><Key>${xmlEscape(state.customKey)}</Key></ProductKey>`);
  }
  push(`      </UserData>`);
  push(`    </component>`);

  push(`  </settings>`);

  push(`  <settings pass="specialize">`);
  push(`    <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="${state.arch}" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">`);
  if(state.computerNameMode==='custom' && state.computerName){
    push(`      <ComputerName>${xmlEscape(state.computerName)}</ComputerName>`);
  }
  if(state.timezoneMode==='custom'){
    push(`      <TimeZone>${xmlEscape(state.timezone)}</TimeZone>`);
  }
  push(`    </component>`);

  push(`    <component name="Microsoft-Windows-International-Core" processorArchitecture="${state.arch}" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">`);
  push(`      <InputLocale>${state.keyboard}</InputLocale>`);
  push(`      <SystemLocale>${state.uiLang}</SystemLocale>`);
  push(`      <UILanguage>${state.uiLang}</UILanguage>`);
  push(`      <UserLocale>${state.uiLang}</UserLocale>`);
  push(`      <GeoLocation>${state.geoId}</GeoLocation>`);
  push(`    </component>`);
  push(`  </settings>`);

  push(`  <settings pass="oobeSystem">`);
  push(`    <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="${state.arch}" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">`);
  push(`      <OOBE>`);
  push(`        <HideEULAPage>true</HideEULAPage>`);
  push(`        <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>`);
  push(`        <HideOnlineAccountScreens>true</HideOnlineAccountScreens>`);
  push(`        <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>`);
  push(`        <NetworkLocation>Home</NetworkLocation>`);
  push(`        <ProtectYourPC>${state.express==='disable'?3:1}</ProtectYourPC>`);
  push(`        <SkipMachineOOBE>true</SkipMachineOOBE>`);
  push(`        <SkipUserOOBE>true</SkipUserOOBE>`);
  push(`      </OOBE>`);

  const validAccounts = state.accounts.filter(a=>a.name.trim());
  if(validAccounts.length){
    push(`      <UserAccounts>`);
    push(`        <LocalAccounts>`);
    validAccounts.forEach(acc=>{
      push(`          <LocalAccount wcm:action="add">`);
      push(`            <Name>${xmlEscape(acc.name)}</Name>`);
      if(acc.display) push(`            <DisplayName>${xmlEscape(acc.display)}</DisplayName>`);
      push(`            <Group>${acc.group}</Group>`);
      if(acc.password){
        push(`            <Password><Value>${xmlEscape(acc.password)}</Value><PlainText>true</PlainText></Password>`);
      }
      push(`          </LocalAccount>`);
    });
    push(`        </LocalAccounts>`);
    push(`      </UserAccounts>`);

    if(state.autologonMode==='first'){
      const first = validAccounts[0];
      push(`      <AutoLogon>`);
      push(`        <Username>${xmlEscape(first.name)}</Username>`);
      push(`        <Enabled>true</Enabled>`);
      push(`        <LogonCount>1</LogonCount>`);
      push(`        <Password><Value>${xmlEscape(first.password||'')}</Value><PlainText>true</PlainText></Password>`);
      push(`      </AutoLogon>`);
    }
  }

  const cmds=[];
  if(!state.uac) cmds.push({d:'Disable UAC', c:`reg.exe add "HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System" /v EnableLUA /t REG_DWORD /d 0 /f`});
  if(!state.smartscreen) cmds.push({d:'Disable SmartScreen', c:`reg.exe add "HKLM\\SOFTWARE\\Microsoft\\Windows\\System" /v EnableSmartScreen /t REG_DWORD /d 0 /f`});
  if(!state.fastStartup) cmds.push({d:'Disable Fast Startup', c:`reg.exe add "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Power" /v HiberbootEnabled /t REG_DWORD /d 0 /f`});
  if(!state.systemRestore) cmds.push({d:'Disable System Restore', c:`powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Disable-ComputerRestore -Drive 'C:\\'"`});
  if(!state.windowsUpdate) cmds.push({d:'Disable Windows Update service', c:`sc.exe config wuauserv start= disabled`});
  if(state.passwordExpiration==='never') cmds.push({d:'Passwords never expire', c:`powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-LocalUser | Set-LocalUser -PasswordNeverExpires 1"`});
  if(state.showHiddenFiles) cmds.push({d:'Show hidden files', c:`reg.exe add "HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced" /v Hidden /t REG_DWORD /d 1 /f`});
  if(state.showExtensions) cmds.push({d:'Show file extensions', c:`reg.exe add "HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced" /v HideFileExt /t REG_DWORD /d 0 /f`});
  if(state.classicContext) cmds.push({d:'Classic context menu', c:`reg.exe add "HKCU\\Software\\Classes\\CLSID\\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\\InprocServer32" /f /ve`});
  if(state.thisPCDefault) cmds.push({d:'Open Explorer to This PC', c:`reg.exe add "HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced" /v LaunchTo /t REG_DWORD /d 1 /f`});
  if(state.endTask) cmds.push({d:'Show End Task in taskbar', c:`reg.exe add "HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced\\TaskbarDeveloperSettings" /v TaskbarEndTask /t REG_DWORD /d 1 /f`});
  if(state.express==='disable'){
    cmds.push({d:'Disable telemetry', c:`reg.exe add "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection" /v AllowTelemetry /t REG_DWORD /d 0 /f`});
    cmds.push({d:'Disable advertising ID', c:`reg.exe add "HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\AdvertisingInfo" /v Enabled /t REG_DWORD /d 0 /f`});
  }
  if(state.visualEffects==='performance') cmds.push({d:'Best performance visual effects', c:`reg.exe add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f`});
  if(state.visualEffects==='appearance') cmds.push({d:'Best appearance visual effects', c:`reg.exe add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 1 /f`});

  Object.entries(state.bloat).forEach(([pattern,on])=>{
    if(!on) return;
    if(pattern==='__ONEDRIVE__'){
      cmds.push({d:'Remove OneDrive', c:`powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Start-Process -FilePath \\"$env:SystemRoot\\SysWOW64\\OneDriveSetup.exe\\" -ArgumentList '/uninstall' -Wait -ErrorAction SilentlyContinue"`});
    } else {
      cmds.push({d:'Remove app '+pattern, c:`powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-AppxPackage -AllUsers -Name '${pattern}' | Remove-AppxPackage -ErrorAction SilentlyContinue"`});
    }
  });

  if(state.firstLogonScript && state.firstLogonScript.trim()){
    const encoded = toUtf16LEBase64(state.firstLogonScript);
    cmds.push({d:'Run custom script', c:`powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand ${encoded}`});
  }

  if(cmds.length){
    push(`      <FirstLogonCommands>`);
    cmds.forEach((cmd,i)=>{
      push(`        <SynchronousCommand wcm:action="add">`);
      push(`          <Order>${i+1}</Order>`);
      push(`          <CommandLine>${xmlEscape(cmd.c)}</CommandLine>`);
      push(`          <Description>${xmlEscape(cmd.d)}</Description>`);
      push(`          <RequiresUserInput>false</RequiresUserInput>`);
      push(`        </SynchronousCommand>`);
    });
    push(`      </FirstLogonCommands>`);
  }

  push(`    </component>`);

  push(`    <component name="Microsoft-Windows-International-Core" processorArchitecture="${state.arch}" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">`);
  push(`      <InputLocale>${state.keyboard}</InputLocale>`);
  push(`      <SystemLocale>${state.uiLang}</SystemLocale>`);
  push(`      <UILanguage>${state.uiLang}</UILanguage>`);
  push(`      <UserLocale>${state.uiLang}</UserLocale>`);
  push(`    </component>`);

  push(`  </settings>`);
  push(`</unattend>`);

  return L.join('\n');
}

function downloadXML(){
  const xml = generateXML();
  const blob = new Blob([xml],{type:'application/xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='autounattend.xml';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function applyAppLangChrome(){
  const html = document.getElementById('htmlRoot');
  html.dir = state.appLang==='fa' ? 'rtl' : 'ltr';
  html.lang = state.appLang==='fa' ? 'fa' : 'en';
  html.setAttribute('data-applang', state.appLang);
  document.getElementById('appTitle').textContent = t('appTitle');
  document.getElementById('appSubtitle').textContent = t('appSubtitle');
  document.getElementById('sourceLink').textContent = t('sourceLink');
  document.getElementById('footerNote').textContent = t('footer');
  document.getElementById('langFaBtn').classList.toggle('active', state.appLang==='fa');
  document.getElementById('langEnBtn').classList.toggle('active', state.appLang==='en');
}
document.getElementById('langFaBtn').onclick=()=>{ state.appLang='fa'; applyAppLangChrome(); renderAll(); };
document.getElementById('langEnBtn').onclick=()=>{ state.appLang='en'; applyAppLangChrome(); renderAll(); };

function renderAll(){
  renderSidebar();
  stepRenderers[current]();
  window.scrollTo({top:0,behavior:'smooth'});
}
applyAppLangChrome();
renderAll();
</script>
</body>
</html>
